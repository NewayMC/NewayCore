modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license }"
issueTrackerURL = "https://github.com/NewayMC/NewayCore/issues"

[[mods]] #mandatory
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL="https://github.com/NewayMC/NewayCore"
logoFile="logo.png"
credits="NewayMC Studio"
authors = "${mod_author}"
description = "${mod_description}"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
