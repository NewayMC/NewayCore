modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
updateJSONURL = "https://newaymc.github.io/NewayCore/update.json"
issueTrackerURL = "https://github.com/NewayMC/NewayCore/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL="https://github.com/NewayMC/NewayCore"
logoFile="logo.png"
authors = "${mod_author}"
description = "${mod_description}"

[[dependencies."${mod_id}"]]
